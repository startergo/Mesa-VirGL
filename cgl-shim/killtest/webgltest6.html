<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>W6</title></head>
<body style="font:14px monospace;background:#333;color:#eee">
<canvas id="c" width="400" height="300" style="border:1px solid #888"></canvas>
<pre id="out"></pre>
<script>
var out = document.getElementById("out"), logbuf = "";
function log(s) { out.textContent += s + "\n"; logbuf += s + " | ";
                  document.title = ("W6: " + logbuf).substring(0, 300); }
var c = document.getElementById("c");
var gl = c.getContext("webgl") || c.getContext("experimental-webgl");
if (!gl) { log("no ctx"); } else {
  log("ctx");
  /* FBO: clear magenta, read with a PREFILLED buffer (0xAA=170).
     170 unchanged => readPixels never wrote (early return).
     0,0,0,0       => transfer ran, host texture empty.
     255,0,255,255 => clear landed (then dfb is the odd one). */
  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 400, 300, 0, gl.RGBA,
                gl.UNSIGNED_BYTE, null);
  var fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0,
                          gl.TEXTURE_2D, tex, 0);
  gl.clearColor(1.0, 0.0, 1.0, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.finish();
  var p = new Uint8Array(4);
  p[0] = 170; p[1] = 170; p[2] = 170; p[3] = 170;
  gl.readPixels(200, 150, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
  log("fbo:" + p[0] + "," + p[1] + "," + p[2] + "," + p[3]);
  gl.readPixels(5, 5, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
  log("fbo5:" + p[0] + "," + p[1] + "," + p[2] + "," + p[3]);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  /* default framebuffer: clear blue, prefilled read */
  gl.clearColor(0.2, 0.6, 1.0, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.finish();
  p[0] = 170; p[1] = 170; p[2] = 170; p[3] = 170;
  gl.readPixels(200, 150, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
  log("dfb:" + p[0] + "," + p[1] + "," + p[2] + "," + p[3]);
  log("err 0x" + gl.getError().toString(16));
  requestAnimationFrame(function () {
    p[0] = 170; p[1] = 170; p[2] = 170; p[3] = 170;
    gl.readPixels(200, 150, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
    log("dfbP:" + p[0] + "," + p[1] + "," + p[2] + "," + p[3]);
    log("err2 0x" + gl.getError().toString(16));
  });
}
</script>
</body>
</html>
