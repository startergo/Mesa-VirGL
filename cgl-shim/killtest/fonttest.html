<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Web-font one-variable test</title>
<style>
@font-face {
  font-family: "LocalWebFont";
  /* PRRT_kwDOPZhcm86uEfdV: relative to this HTML file (the old absolute
   * /Library/Fonts/Andale Mono.ttf broke on guests without that font,
   * and a failed web-font load falls back to monospace — visually
   * identical to the SYSTEM line, hiding the failure). If AndaleMono.ttf
   * is missing next to this file the WEBFONT line renders in plain
   * monospace: treat that as a failed load, not a pass. */
  src: url("AndaleMono.ttf") format("truetype");
}
.wf { font-family: "LocalWebFont", monospace; font-size: 28px; }
.sf { font-family: monospace; font-size: 28px; }
</style>
</head>
<body>
<p class="wf">WEBFONT LINE: The quick brown fox jumps over the lazy dog 0123456789</p>
<p class="sf">SYSTEM LINE: The quick brown fox jumps over the lazy dog 0123456789</p>
</body>
</html>
